name: common-format

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      # Prettier owns the whole repository, so it runs once here rather than
      # once per package.
      - name: Linting Prettier
        run: pnpm lint:prettier
